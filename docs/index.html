<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Decor - Decoração que inspira. Ambientes que acolhem.</title>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var idiomas = ['pt', 'en', 'es'];
            var lang = (navigator.language || navigator.userLanguage || 'pt').substring(0, 2);
            if (idiomas.includes(lang)) {
                window.location.href = '/' + lang + '/';
            }
        });
    </script>
</head>
<body>
    <h1>Home Decor</h1>
    <p>Inspirações, ideias e dicas de decoração para transformar sua casa em um lar aconchegante e estiloso.</p>
    <div class="lang-options">
        <a href="/pt/" class="lang-option">Português</a>
<a href="/en/" class="lang-option">English</a>
<a href="/es/" class="lang-option">Español</a>

    </div>
</body>
</html>
