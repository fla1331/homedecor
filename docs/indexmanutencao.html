<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Em manutenção — Seu Site</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  .wrap {
    max-width: 420px;
    animation: fadeIn 0.6s ease;
  }

  .leaf {
    width: 96px;
    height: 96px;
    margin: 0 auto 28px;
    display: block;
    color: #4a7c4a;
  }

  h1 {
    font-size: 1.35rem;
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }

  p {
    font-size: 0.95rem;
    line-height: 1.5;
    color: #5a6b5a;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-color-scheme: dark) {
    html, body { background: #fff; color: #333; }
    p { color: #8a9a8a; }
    .leaf { color: #7db07d; }
  }
</style>
</head>
<body>

  <main class="wrap">
   <svg viewBox="0 0 24 24" width="42" height="42" fill="none" aria-hidden="true">
          <path d="M3 11.5 12 4l9 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 10.5V20h14v-9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.5 20v-5h5v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

    <h1 id="title">Voltamos em breve</h1>
    <p id="sub">Estamos fazendo uma manutenção rápida. Obrigado pela paciência!</p>
  </main>

<script>
  // Detecta idioma do navegador e traduz automaticamente
  const i18n = {
    pt: {
      title: "Voltamos em breve",
      sub:   "Estamos fazendo uma manutenção rápida. Obrigado pela paciência!"
    },
    en: {
      title: "Back soon",
      sub:   "We're doing a quick maintenance. Thanks for your patience!"
    },
    es: {
      title: "Volvemos pronto",
      sub:   "Estamos haciendo un mantenimiento rápido. ¡Gracias por tu paciencia!"
    }
  };

  const lang = (navigator.language || "pt").slice(0, 2).toLowerCase();
  const t = i18n[lang] || i18n.pt;

  document.documentElement.lang = i18n[lang] ? lang : "pt";
  document.getElementById("title").textContent = t.title;
  document.getElementById("sub").textContent   = t.sub;
</script>

</body>
</html>
