<svg viewBox="0 0 24 24" width="32" height="32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- Gradiente principal (branco → marrom) -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c9a27e"/>
      <stop offset="100%" stop-color="#6b3e26"/>
    </linearGradient>

    <!-- Fundo circular suave -->
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3a241a"/>
      <stop offset="100%" stop-color="#1a0f08"/>
    </radialGradient>

    <!-- Sombra leve no ícone -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fundo (remova essa tag se quiser transparente) -->
  <circle cx="12" cy="12" r="12" fill="url(#bg)"/>

  <!-- Ícone com gradiente e sombra -->
  <g fill="none"
     stroke="url(#grad)"
     stroke-width="1.6"
     stroke-linecap="round"
     stroke-linejoin="round"
     filter="url(#shadow)">
    <path d="M3 11.5 12 4l9 7.5"/>
    <path d="M5 10.5V20h14v-9.5"/>
    <path d="M9.5 20v-5h5v5"/>
  </g>
</svg>