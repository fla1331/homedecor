<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Decor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 90%;
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 1.8rem;
            color: #1e293b;
            margin-bottom: 8px;
        }
        p {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .lang-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .lang-option {
            display: block;
            padding: 12px 20px;
            background: #f1f5f9;
            color: #1e293b;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .lang-option:hover {
            background: #e2e8f0;
        }
        .lang-option.default {
            background: #1e293b;
            color: white;
        }
        .lang-option.default:hover {
            background: #0f172a;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var idiomas = ['pt', 'en', 'es'];
            var lang = (navigator.language || navigator.userLanguage || 'pt').substring(0, 2);
            if (idiomas.includes(lang)) {
                window.location.href = '/' + lang + '/';
            }
        });
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">🏠</div>
        <h1>Home Decor</h1>
        <p>Inspirações para transformar sua casa em um lar aconchegante e estiloso.</p>
        <div class="lang-options">
            <a href="/pt/" class="lang-option">Português</a>
<a href="/en/" class="lang-option">English</a>
<a href="/es/" class="lang-option">Español</a>

        </div>
    </div>
</body>
</html>
